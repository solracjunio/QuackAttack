name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Mesma versão do devbox.json e do build.zig.zon.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Formatação
        run: zig fmt --check build.zig src/

      # Só a lógica: não compila a raylib, então não precisa de X11 nem OpenGL.
      - name: Testes
        run: zig build test --summary all
